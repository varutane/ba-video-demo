<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ビフォーアフター動画メーカー（試作）</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0; padding: 16px; background: #faf7f4; color: #333;
    max-width: 560px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  .sub { color: #777; font-size: 13px; margin: 0 0 16px; }
  section {
    background: #fff; border: 1px solid #e7ded6; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .photos { display: flex; gap: 12px; }
  .photo-box { flex: 1; }
  .photo-box .thumb {
    width: 100%; aspect-ratio: 9 / 12; object-fit: cover;
    background: #eee; border-radius: 8px; display: block; margin-bottom: 8px;
  }
  .photo-box label.file {
    display: block; text-align: center; background: #f3ece5; border: 1px solid #ddd0c2;
    border-radius: 8px; padding: 8px 4px; font-size: 14px; cursor: pointer;
  }
  .photo-box input[type="file"] { display: none; }
  .sample-btn {
    margin-top: 12px; width: 100%; padding: 9px; font-size: 14px;
    background: #fff; border: 1px solid #ccc; border-radius: 8px; cursor: pointer;
  }
  .choices label {
    display: block; padding: 7px 8px; border-radius: 8px; font-size: 15px; cursor: pointer;
  }
  .choices label:hover { background: #faf3ec; }
  .choices input { margin-right: 8px; }
  #makeBtn {
    width: 100%; padding: 16px; font-size: 18px; font-weight: bold;
    background: #e2603f; color: #fff; border: none; border-radius: 12px; cursor: pointer;
  }
  #makeBtn:disabled { background: #cbb; cursor: wait; }
  #status { text-align: center; color: #666; min-height: 1.4em; font-size: 14px; }
  .stage { text-align: center; }
  canvas {
    width: min(78vw, 300px); height: auto; background: #111;
    border-radius: 10px;
  }
  #preview {
    width: min(78vw, 300px); border-radius: 10px; display: none; margin: 10px auto 0;
  }
  #dl {
    display: none; margin: 12px auto 0; width: fit-content;
    background: #2e7d4f; color: #fff; text-decoration: none;
    padding: 12px 22px; border-radius: 10px; font-size: 16px; font-weight: bold;
  }
  .note { font-size: 12px; color: #999; text-align: center; }
  #audioFileBox { display: none; padding: 4px 8px 2px; }
  #audioFileBox label.file {
    display: block; text-align: center; background: #f3ece5; border: 1px solid #ddd0c2;
    border-radius: 8px; padding: 8px 4px; font-size: 14px; cursor: pointer;
  }
  #audioFileBox input[type="file"] { display: none; }
  #audioFileName { font-size: 13px; color: #666; margin: 6px 0 0; }
  #salonName {
    width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px;
    border: 1px solid #ddd0c2; border-radius: 8px; background: #fff; margin-bottom: 10px;
  }
  #logoBox label.file {
    display: block; text-align: center; background: #f3ece5; border: 1px solid #ddd0c2;
    border-radius: 8px; padding: 8px 4px; font-size: 14px; cursor: pointer;
  }
  #logoBox input[type="file"] { display: none; }
  #logoThumb { display: none; max-width: 180px; max-height: 64px; margin: 8px auto 0; }
</style>
</head>
<body>

<h1>ビフォーアフター動画メーカー</h1>
<p class="sub">写真を2枚入れるだけで、Instagram用の動画（約9秒・縦型）ができます。試作版です。</p>

<section>
  <h2>1. 写真</h2>
  <div class="photos">
    <div class="photo-box">
      <img class="thumb" id="thumbBefore" alt="ビフォー写真">
      <label class="file">まえの写真を選ぶ
        <input type="file" id="fileBefore" accept="image/*">
      </label>
    </div>
    <div class="photo-box">
      <img class="thumb" id="thumbAfter" alt="アフター写真">
      <label class="file">あとの写真を選ぶ
        <input type="file" id="fileAfter" accept="image/*">
      </label>
    </div>
  </div>
  <button class="sample-btn" id="sampleBtn" type="button">サンプルで試す</button>
</section>

<section>
  <h2>お店の名前（任意）</h2>
  <input type="text" id="salonName" placeholder="サロン名（動画に表示されます）">
  <div id="logoBox">
    <label class="file">ロゴ画像を使う（任意）
      <input type="file" id="fileLogo" accept="image/*">
    </label>
    <img id="logoThumb" alt="ロゴ">
  </div>
  <p class="note">名前とロゴの両方がある場合は、組み合わせて表示されます（コラージュ／トランプのとき）。</p>
</section>

<section>
  <h2>2. 動き</h2>
  <div class="choices" id="patternChoices">
    <label><input type="radio" name="pattern" value="collage" checked>コラージュ（2枚を並べて見せる・標準）</label>
    <label><input type="radio" name="pattern" value="trump">トランプ（お店のカードがめくれて入れ替わる）</label>
    <label><input type="radio" name="pattern" value="cut">カット（パッと切り替わる）</label>
    <label><input type="radio" name="pattern" value="wipe">ワイプ（左から開く）</label>
    <label><input type="radio" name="pattern" value="fadezoom">フェード＋ズーム（溶けながら寄る）</label>
    <label><input type="radio" name="pattern" value="flip">カードめくり（ひっくり返る）</label>
    <label><input type="radio" name="pattern" value="page">ページ捲り（ページをめくる感じ）</label>
  </div>
  <h2 style="margin-top:14px;">写真の見せ方</h2>
  <div class="choices" id="fitChoices">
    <label><input type="radio" name="fit" value="cover" checked>トリミング（画面いっぱいに広げる）</label>
    <label><input type="radio" name="fit" value="blur">ぼかし背景（写真全体を見せる）</label>
  </div>
</section>

<section>
  <h2>3. 音楽</h2>
  <div class="choices" id="musicChoices">
    <label><input type="radio" name="music" value="suno1" checked>フレッシュ（明るいポップ）</label>
    <label><input type="radio" name="music" value="suno2">カフェ（アコースティック）</label>
    <label><input type="radio" name="music" value="suno3">シティポップ</label>
    <label><input type="radio" name="music" value="suno4">ピアノ（上品）</label>
    <label><input type="radio" name="music" value="suno5">チル（エレクトロ）</label>
    <label><input type="radio" name="music" value="file">自分の音源ファイル</label>
    <label><input type="radio" name="music" value="none">音楽なし</label>
  </div>
  <div id="audioFileBox">
    <label class="file">音源ファイルを選ぶ（mp3など）
      <input type="file" id="fileAudio" accept="audio/*">
    </label>
    <p id="audioFileName"></p>
  </div>
</section>

<button id="makeBtn" type="button">動画にする</button>
<p id="status"></p>

<section class="stage">
  <canvas id="cv" width="720" height="1280"></canvas>
  <video id="preview" controls playsinline></video>
  <a id="dl" href="#" download="before-after.webm">動画をダウンロード</a>
</section>

<p class="note">※ 動画を作っている間（約9秒）は、そのままお待ちください。Chrome推奨です。</p>

<script>
'use strict';

/* ===== 基本設定 ===== */
var W = 720, H = 1280;
var T_TEASE = 1.2;   // 冒頭：afterチラ見せ
var T_BEFORE = 2.5;  // before表示
var T_PAUSE = 0.5;   // 「間」（before静止）
var T_TRANS = 0.6;   // 切り替え
var T_AFTER = 4.0;   // after表示
var T1 = T_TEASE;                 // 1.2
var T2 = T1 + T_BEFORE;           // 3.7
var T3 = T2 + T_PAUSE;            // 4.2（切り替え開始）
var TOTAL = T3 + T_TRANS + T_AFTER; // 8.8

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var imgBefore = null, imgAfter = null;
var salonName = '', imgLogo = null;

function selected(name) {
  var el = document.querySelector('input[name="' + name + '"]:checked');
  return el ? el.value : null;
}
function transDur(pattern) { return pattern === 'cut' ? 0 : T_TRANS; }
function ease(p) { return p * p * (3 - 2 * p); }
function easeInOut(p) {
  p = Math.max(0, Math.min(1, p));
  return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
}

/* ===== 描画 ===== */
var activeFit = 'cover'; // 'cover'（トリミング） / 'blur'（ぼかし背景）

// ぼかし背景用：小さく描いて拡大することでぼかした絵を作る（使い回す）
function getBlurred(img) {
  if (img._blurCv) return img._blurCv;
  var s = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  var dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  var f = 24;
  var c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(dw / f));
  c.height = Math.max(2, Math.round(dh / f));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  img._blurCv = c;
  return c;
}

// 写真を描く。見せ方（activeFit）で切り替える。
// cover: 画面いっぱいに中央トリミング / blur: ぼかし背景＋写真全体
// opts: alpha / zoom / sx（横方向の潰れ：カードめくり用）/ shade（影）
function drawCover(img, opts) {
  opts = opts || {};
  var alpha = (opts.alpha != null) ? opts.alpha : 1;
  var zoom = opts.zoom || 1;
  var sx = (opts.sx != null) ? opts.sx : 1;
  var shade = opts.shade || 0;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2);
  ctx.scale(sx, 1);
  if (activeFit === 'blur') {
    var bs = Math.max(W / img.naturalWidth, H / img.naturalHeight) * zoom;
    var bw = img.naturalWidth * bs, bh = img.naturalHeight * bs;
    ctx.drawImage(getBlurred(img), -bw / 2, -bh / 2, bw, bh);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
    var fs = Math.min(W / img.naturalWidth, H / img.naturalHeight) * zoom;
    ctx.drawImage(img, -img.naturalWidth * fs / 2, -img.naturalHeight * fs / 2,
      img.naturalWidth * fs, img.naturalHeight * fs);
  } else {
    var s = Math.max(W / img.naturalWidth, H / img.naturalHeight) * zoom;
    var dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  }
  ctx.restore();
  if (shade > 0) {
    var w2 = W * Math.abs(sx);
    ctx.fillStyle = 'rgba(0,0,0,' + shade.toFixed(3) + ')';
    ctx.fillRect((W - w2) / 2, 0, w2, H);
  }
}

/* ===== Before/Afterラベル ===== */
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// 左上に、白文字＋半透明の黒帯のラベルを描く
function drawLabel(text) {
  ctx.save();
  ctx.font = 'bold 30px sans-serif';
  var tw = ctx.measureText(text).width;
  var bw = tw + 36, bh = 52, x = 26, y = 26;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRectPath(x, y, bw, bh, 12);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + bw / 2, y + bh / 2 + 2);
  ctx.restore();
}

/* ===== コラージュ（写真風カードを並べる） ===== */
// 白フチ付きの写真カードを1枚描く。下のフチにラベルを書く。
function drawCard(img, cx, cy, cw, ch, rotDeg, label, alpha, dy, scale, dx) {
  scale = scale || 1;
  var pad = 14, padB = 58;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx + (dx || 0), cy + (dy || 0));
  ctx.rotate(rotDeg * Math.PI / 180);
  ctx.scale(scale, scale);
  // 影
  ctx.fillStyle = 'rgba(70,50,40,0.28)';
  ctx.fillRect(-cw / 2 - pad + 9, -ch / 2 - pad + 13, cw + pad * 2, ch + pad + padB);
  // 白フチ
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-cw / 2 - pad, -ch / 2 - pad, cw + pad * 2, ch + pad + padB);
  // 写真（カードの形にトリミング）
  ctx.save();
  ctx.beginPath();
  ctx.rect(-cw / 2, -ch / 2, cw, ch);
  ctx.clip();
  var s = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
  ctx.drawImage(img, -img.naturalWidth * s / 2, -img.naturalHeight * s / 2,
    img.naturalWidth * s, img.naturalHeight * s);
  ctx.restore();
  // ラベル
  ctx.fillStyle = '#666';
  ctx.font = 'bold 30px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, 0, ch / 2 + padB / 2 + 6);
  ctx.restore();
}

var T_ENTER = 0.85; // コラージュ：カードの登場にかける時間

// 行き過ぎてから収まるイージング（置いた感じを出す）
function easeOutBack(p) {
  p = Math.max(0, Math.min(1, p));
  var c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
}
function lerp(a, b, p) { return a + (b - a) * p; }

// 台紙の上の方に、サロン名とロゴを描く（両方あれば組み合わせ）
function drawSalonBrand(t) {
  var a = Math.min(1, t / 0.6);
  if (a <= 0 || (!imgLogo && !salonName)) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#7a6552';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (imgLogo && salonName) {
    var s1 = Math.min(200 / imgLogo.naturalWidth, 68 / imgLogo.naturalHeight);
    ctx.drawImage(imgLogo, W / 2 - imgLogo.naturalWidth * s1 / 2, 92 - imgLogo.naturalHeight * s1 / 2,
      imgLogo.naturalWidth * s1, imgLogo.naturalHeight * s1);
    ctx.font = '600 34px Georgia, "Hiragino Mincho ProN", serif';
    try { ctx.letterSpacing = '3px'; } catch (e) {}
    ctx.fillText(salonName, W / 2, 156);
  } else if (imgLogo) {
    var s2 = Math.min(320 / imgLogo.naturalWidth, 110 / imgLogo.naturalHeight);
    ctx.drawImage(imgLogo, W / 2 - imgLogo.naturalWidth * s2 / 2, 128 - imgLogo.naturalHeight * s2 / 2,
      imgLogo.naturalWidth * s2, imgLogo.naturalHeight * s2);
  } else {
    ctx.font = '600 44px Georgia, "Hiragino Mincho ProN", serif';
    try { ctx.letterSpacing = '4px'; } catch (e) {}
    ctx.fillText(salonName, W / 2, 128);
  }
  ctx.restore();
}

function drawCollage(t) {
  ctx.fillStyle = '#f3ece5';
  ctx.fillRect(0, 0, W, H);
  drawSalonBrand(t);
  var cw = 400, ch = 520;
  // 両方出そろったあとは、全体がゆっくり育つ（寄る）
  var grow = 1;
  if (t > T3 + T_ENTER) {
    grow = 1 + 0.025 * easeInOut(Math.min(1, (t - T3 - T_ENTER) / (TOTAL - T3 - T_ENTER)));
  }
  // Before：左上から回転しながら落ちてきて、所定の傾き（-4°）で止まる
  var pb = easeOutBack(Math.min(1, t / T_ENTER));
  drawCard(imgBefore, 280, 500, cw, ch,
    lerp(-17, -4, pb), 'Before', Math.min(1, t / 0.35),
    (1 - pb) * -150, (0.9 + 0.1 * pb) * grow, (1 - pb) * -60);
  // After：右下から大きく回転しながら上がってきて、所定の傾き（3°）で止まる
  if (t >= T3) {
    var pa = easeOutBack(Math.min(1, (t - T3) / T_ENTER));
    drawCard(imgAfter, 450, 830, cw, ch,
      lerp(21, 3, pa), 'After', Math.min(1, (t - T3) / 0.3),
      (1 - pa) * 260, (0.9 + 0.1 * pa) * grow, (1 - pa) * 120);
  }
}

/* ===== トランプ（お店のカード） =====
   裏＝お店のカード（名前・ロゴ）。めくれると表はBefore全面。
   カードが180°回る途中で白フラッシュを挟んでAfterに入れ替わり、
   Afterは逆さに描いてあるので回り切ると正向きになる。
   （上下2分割は髪の長さが見えなくなるため不採用：2026-11-27 菜摘） */
var TRUMP_W = 664, TRUMP_H = 1180;

function trumpRoundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// カードの土台（白いカード＋影）。中心原点で描く
function trumpBase() {
  ctx.save();
  ctx.shadowColor = 'rgba(70,50,40,0.35)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 14;
  ctx.fillStyle = '#ffffff';
  trumpRoundRect(-TRUMP_W / 2, -TRUMP_H / 2, TRUMP_W, TRUMP_H, 28);
  ctx.fill();
  ctx.restore();
}

// カード全面に写真を1枚描く。inverted=true のときは描画自体を180°回しておき、
// カードが180°回転し終わった時点で正位置になる（After用）
function trumpPhoto(img, label, inverted) {
  var pad = 14, iw = TRUMP_W - pad * 2, ih = TRUMP_H - pad * 2;
  var topY = -TRUMP_H / 2 + pad;
  ctx.save();
  if (inverted) ctx.rotate(Math.PI);
  ctx.save();
  trumpRoundRect(-iw / 2, topY, iw, ih, 14);
  ctx.clip();
  var s = Math.max(iw / img.naturalWidth, ih / img.naturalHeight);
  ctx.drawImage(img, -img.naturalWidth * s / 2, topY + ih / 2 - img.naturalHeight * s / 2,
    img.naturalWidth * s, img.naturalHeight * s);
  ctx.restore();
  // ラベル（左上）
  ctx.save();
  ctx.font = 'bold 24px sans-serif';
  var tw = ctx.measureText(label).width;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  trumpRoundRect(-iw / 2 + 12, topY + 12, tw + 24, 40, 10);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, -iw / 2 + 12 + (tw + 24) / 2, topY + 33);
  ctx.restore();
  ctx.restore();
}

// 裏：お店のカード（名前・ロゴ）
function trumpBack() {
  trumpBase();
  ctx.save();
  ctx.strokeStyle = '#cbb79e';
  ctx.lineWidth = 2;
  trumpRoundRect(-TRUMP_W / 2 + 18, -TRUMP_H / 2 + 18, TRUMP_W - 36, TRUMP_H - 36, 20);
  ctx.stroke();
  if (imgLogo && salonName) {
    var s3 = Math.min(260 / imgLogo.naturalWidth, 130 / imgLogo.naturalHeight);
    ctx.drawImage(imgLogo, -imgLogo.naturalWidth * s3 / 2, -78 - imgLogo.naturalHeight * s3 / 2,
      imgLogo.naturalWidth * s3, imgLogo.naturalHeight * s3);
    ctx.fillStyle = '#7a6552';
    ctx.font = '600 40px Georgia, "Hiragino Mincho ProN", serif';
    try { ctx.letterSpacing = '3px'; } catch (e) {}
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(salonName, 0, 78);
  } else if (imgLogo) {
    var s = Math.min(300 / imgLogo.naturalWidth, 150 / imgLogo.naturalHeight);
    ctx.drawImage(imgLogo, -imgLogo.naturalWidth * s / 2, -imgLogo.naturalHeight * s / 2,
      imgLogo.naturalWidth * s, imgLogo.naturalHeight * s);
  } else if (salonName) {
    ctx.fillStyle = '#7a6552';
    ctx.font = '600 42px Georgia, "Hiragino Mincho ProN", serif';
    try { ctx.letterSpacing = '3px'; } catch (e) {}
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(salonName, 0, 0);
  } else {
    ctx.save();
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#b08968';
    ctx.fillRect(-26, -26, 52, 52);
    ctx.restore();
    ctx.fillStyle = '#7a6552';
    ctx.font = '600 30px Georgia, serif';
    try { ctx.letterSpacing = '6px'; } catch (e) {}
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('HAIR SALON', 0, 88);
  }
  ctx.restore();
}

function trumpDrawFace(face, rotDeg, sx, scale, alpha, dy, shade, flash) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2 + (dy || 0));
  ctx.rotate(rotDeg * Math.PI / 180);
  ctx.scale(Math.max(0.02, Math.abs(sx)) * scale, scale);
  if (face === 'back') trumpBack();
  else if (face === 'before') { trumpBase(); trumpPhoto(imgBefore, 'Before', false); }
  else { trumpBase(); trumpPhoto(imgAfter, 'After', true); }
  if (shade > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + shade.toFixed(3) + ')';
    trumpRoundRect(-TRUMP_W / 2, -TRUMP_H / 2, TRUMP_W, TRUMP_H, 28);
    ctx.fill();
  }
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + flash.toFixed(3) + ')';
    trumpRoundRect(-TRUMP_W / 2, -TRUMP_H / 2, TRUMP_W, TRUMP_H, 28);
    ctx.fill();
  }
  ctx.restore();
}

function drawTrump(t) {
  ctx.fillStyle = '#e9dfd2';
  ctx.fillRect(0, 0, W, H);
  var IN = 0.85;                 // 裏で登場
  var FLIP1 = 2.0, FLIPD = 0.7;  // 裏→表（Before全面）にめくれる
  var SWAP = 5.2, ROTD = 1.0;    // カードごと180°回転、途中でAfterに入替＋白フラッシュ
  if (t < IN) {
    var p = easeOutBack(Math.min(1, t / IN));
    trumpDrawFace('back', lerp(-16, 0, p), 1, 0.92 + 0.08 * p, Math.min(1, t / 0.3), (1 - p) * -140, 0, 0);
  } else if (t < FLIP1) {
    trumpDrawFace('back', 0, 1, 1, 1, 0, 0, 0);
  } else if (t < FLIP1 + FLIPD) {
    var fp = (t - FLIP1) / FLIPD, th = fp * Math.PI;
    trumpDrawFace(fp < 0.5 ? 'back' : 'before', 0, Math.cos(th), 1, 1, 0, Math.sin(th) * 0.22, 0);
  } else if (t < SWAP) {
    var g1 = 1 + 0.02 * easeInOut(Math.min(1, (t - FLIP1 - FLIPD) / (SWAP - FLIP1 - FLIPD)));
    trumpDrawFace('before', 0, 1, g1, 1, 0, 0, 0);
  } else if (t < SWAP + ROTD) {
    var rp = easeInOut((t - SWAP) / ROTD);
    var face2 = rp < 0.5 ? 'before' : 'after';
    var flash = Math.max(0, 1 - Math.abs(rp - 0.5) / 0.14) * 0.85;
    trumpDrawFace(face2, 180 * rp, 1, 1 - 0.06 * Math.sin(rp * Math.PI), 1, 0, 0, flash);
  } else {
    var g2 = 1 + 0.02 * easeInOut(Math.min(1, (t - SWAP - ROTD) / 1.5));
    trumpDrawFace('after', 180, 1, g2, 1, 0, 0, 0);
  }
}

function drawWipe(p) {
  drawCover(imgBefore);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W * p, H);
  ctx.clip();
  drawCover(imgAfter);
  ctx.restore();
  // 境目の光
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillRect(W * p - 2, 0, 3, H);
}

function drawFadeZoom(p) {
  drawCover(imgBefore);
  drawCover(imgAfter, { alpha: p, zoom: 1 + 0.07 * p });
}

function drawFlip(p) {
  var th = p * Math.PI;
  var shade = Math.sin(th) * 0.35;
  if (p < 0.5) {
    drawCover(imgBefore, { sx: Math.cos(th), shade: shade });
  } else {
    drawCover(imgAfter, { sx: Math.abs(Math.cos(th)), shade: shade });
  }
}

function drawPage(p) {
  drawCover(imgAfter); // 下にafter
  var S = 170; // 斜めの傾き
  var xt = (W + S) * (1 - p); // 上辺での境目x
  var xb = xt - S;            // 下辺での境目x
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(xt, 0);
  ctx.lineTo(xb, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.clip();
  drawCover(imgBefore);
  ctx.restore();
  // 捲れの影（境目付近に帯状グラデーション）
  var a = Math.sin(p * Math.PI) * 0.8;
  if (a > 0.01) {
    var g = ctx.createLinearGradient(xb - 70, 0, xt + 40, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.45, 'rgba(0,0,0,' + (0.40 * a).toFixed(3) + ')');
    g.addColorStop(0.62, 'rgba(255,255,255,' + (0.28 * a).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(Math.max(0, xb - 70), 0, (xt + 40) - Math.max(0, xb - 70), H);
  }
}

function drawFrame(t, pattern) {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);
  if (!imgBefore || !imgAfter) {
    ctx.fillStyle = '#bbb';
    ctx.font = '34px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('写真を2枚選んでください', W / 2, H / 2);
    return;
  }
  if (pattern === 'collage') {
    drawCollage(t);
    return;
  }
  if (pattern === 'trump') {
    drawTrump(t);
    return;
  }
  var label = null;
  if (t < T1) {
    // 冒頭：afterチラ見せ（イージングで緩やかに寄る）
    drawCover(imgAfter, { zoom: 1 + 0.03 * easeInOut(t / T1) });
    label = 'After';
  } else if (t < T3) {
    // before表示＋「間」
    drawCover(imgBefore);
    label = 'Before';
  } else {
    var td = transDur(pattern);
    if (td > 0 && t < T3 + td) {
      var p = easeInOut((t - T3) / td);
      if (pattern === 'wipe') drawWipe(p);
      else if (pattern === 'fadezoom') drawFadeZoom(p);
      else if (pattern === 'flip') drawFlip(p);
      else if (pattern === 'page') drawPage(p);
      else drawCover(imgAfter);
      label = p < 0.5 ? 'Before' : 'After';
    } else {
      // after表示（フェード＋ズームはゆっくり寄り続ける）
      if (pattern === 'fadezoom') {
        var ap = Math.min(1, (t - T3 - td) / T_AFTER);
        drawCover(imgAfter, { zoom: 1.07 + 0.03 * easeInOut(ap) });
      } else {
        drawCover(imgAfter);
      }
      label = 'After';
    }
  }
  if (label) drawLabel(label);
}

/* ===== 音楽（WebAudioで生成する簡易ループ） ===== */
// chords: 1小節ごとの { r: ベース音(midi), t: 和音(midi配列) }
var TRACKS = {
  pop: {
    bpm: 120, kick: true,
    chords: [
      { r: 48, t: [60, 64, 67] },  // C
      { r: 43, t: [59, 62, 67] },  // G
      { r: 45, t: [57, 60, 64] },  // Am
      { r: 41, t: [57, 60, 65] }   // F
    ],
    bassBeats: [0, 1, 2, 3],
    pluck: [3, 4, 5, 4, 3, 4, 2, 4]
  },
  chill: {
    bpm: 84, kick: false,
    chords: [
      { r: 50, t: [62, 65, 69, 72] },  // Dm7
      { r: 43, t: [59, 62, 65] },      // G7
      { r: 48, t: [59, 64, 67] },      // Cmaj7
      { r: 45, t: [60, 64, 67] }       // Am7
    ],
    bassBeats: [0, 2],
    pluck: [3, -1, 4, -1, 2, -1, -1, -1]
  },
  up: {
    bpm: 136, kick: true,
    chords: [
      { r: 45, t: [57, 60, 64] },  // Am
      { r: 41, t: [57, 60, 65] },  // F
      { r: 48, t: [55, 60, 64] },  // C
      { r: 43, t: [55, 59, 62] }   // G
    ],
    bassBeats: [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5],
    pluck: [5, 4, 3, 4, 5, 4, 3, 4]
  }
};

function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function tone(ac, dest, o) {
  var osc = ac.createOscillator();
  var g = ac.createGain();
  osc.type = o.type || 'triangle';
  osc.frequency.setValueAtTime(o.freq, o.t);
  if (o.slideTo) {
    osc.frequency.exponentialRampToValueAtTime(o.slideTo, o.t + Math.min(0.12, o.dur));
  }
  var atk = (o.attack != null) ? o.attack : 0.02;
  g.gain.setValueAtTime(0.0001, o.t);
  g.gain.linearRampToValueAtTime(o.vol, o.t + atk);
  g.gain.setValueAtTime(o.vol, o.t + Math.max(atk, o.dur - 0.06));
  g.gain.linearRampToValueAtTime(0.0001, o.t + o.dur);
  osc.connect(g);
  g.connect(dest);
  osc.start(o.t);
  osc.stop(o.t + o.dur + 0.05);
}

function scheduleTrack(ac, dest, key, startAt, dur) {
  var tr = TRACKS[key];
  if (!tr) return;
  var spb = 60 / tr.bpm;      // 1拍の秒数
  var bar = spb * 4;          // 1小節
  var nBars = Math.ceil(dur / bar);
  for (var b = 0; b < nBars; b++) {
    var t0 = startAt + b * bar;
    if (t0 >= startAt + dur) break;
    var ch = tr.chords[b % tr.chords.length];
    var remain = Math.min(bar, startAt + dur - t0);
    var i, m;
    // パッド（和音）
    for (i = 0; i < ch.t.length; i++) {
      tone(ac, dest, { type: 'triangle', freq: mtof(ch.t[i]), t: t0, dur: remain, vol: 0.045, attack: 0.12 });
    }
    // ベース
    for (i = 0; i < tr.bassBeats.length; i++) {
      var bt = t0 + tr.bassBeats[i] * spb;
      if (bt < startAt + dur) {
        tone(ac, dest, { type: 'sine', freq: mtof(ch.r - 12), t: bt, dur: spb * 0.9, vol: 0.16 });
      }
    }
    // プラック（メロディ）
    var pool = ch.t.concat(ch.t.map(function (n) { return n + 12; }));
    var eighth = spb / 2;
    for (i = 0; i < tr.pluck.length; i++) {
      var idx = tr.pluck[i];
      if (idx < 0) continue;
      var pt = t0 + i * eighth;
      if (pt < startAt + dur) {
        tone(ac, dest, { type: 'triangle', freq: mtof(pool[idx % pool.length]), t: pt, dur: eighth * 0.9, vol: 0.07 });
      }
    }
    // キック
    if (tr.kick) {
      for (i = 0; i < 4; i++) {
        var kt = t0 + i * spb;
        if (kt < startAt + dur) {
          tone(ac, dest, { type: 'sine', freq: 120, slideTo: 45, t: kt, dur: 0.18, vol: 0.32 });
        }
      }
    }
  }
}

/* ===== 利用者の音源ファイル ===== */
var userAudioBuffer = null;
var userAudioDecoding = false;

// デコード済みの音源を、動画の長さに合わせて流す。
// 短い音源はループ、長い音源は offset から使って最後の1.2秒でフェードアウト。
function scheduleUserAudio(ac, dest, buffer, startAt, dur, offset) {
  var off = offset || 0;
  var src = ac.createBufferSource();
  src.buffer = buffer;
  var g = ac.createGain();
  g.gain.setValueAtTime(1, startAt);
  if (buffer.duration - off < dur) {
    src.loop = true;
  } else {
    g.gain.setValueAtTime(1, startAt + dur - 1.2);
    g.gain.linearRampToValueAtTime(0.0001, startAt + dur);
  }
  src.connect(g);
  g.connect(dest);
  src.start(startAt, off);
  src.stop(startAt + dur + 0.05);
}

/* ===== 組み込み楽曲（Suno生成・Aテイク） ===== */
// offset＝音ハメ用の開始位置（切り替えと終わりにアクセントが合うよう解析で選定）
var SUNO_TRACKS = {
  suno1: { src: 'audio/fresh-finish-a.mp3', offset: 1.40 },
  suno2: { src: 'audio/salon-cafe-a.mp3', offset: 62.09 },
  suno3: { src: 'audio/city-gloss-a.mp3', offset: 42.99 },
  suno4: { src: 'audio/quiet-elegance-a.mp3', offset: 64.54 },
  suno5: { src: 'audio/soft-reset-a.mp3', offset: 37.62 }
};
var sunoBuffers = {};
var sunoDecoding = {};

function loadSuno(key) {
  if (!SUNO_TRACKS[key] || sunoBuffers[key] || sunoDecoding[key]) return;
  sunoDecoding[key] = true;
  fetch(SUNO_TRACKS[key].src).then(function (r) { return r.arrayBuffer(); })
    .then(function (ab) {
      var dctx = new (window.AudioContext || window.webkitAudioContext)();
      return dctx.decodeAudioData(ab).then(function (buf) {
        sunoBuffers[key] = buf;
        try { dctx.close(); } catch (e) {}
      }, function (err) {
        try { dctx.close(); } catch (e) {}
        throw err;
      });
    }).then(function () {
      sunoDecoding[key] = false;
    }).catch(function () {
      sunoDecoding[key] = false;
    });
}
loadSuno('suno1');

document.getElementById('musicChoices').addEventListener('change', function () {
  var music = selected('music');
  document.getElementById('audioFileBox').style.display = music === 'file' ? 'block' : 'none';
  if (SUNO_TRACKS[music]) loadSuno(music);
});

document.getElementById('fileAudio').addEventListener('change', function (ev) {
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  document.getElementById('audioFileName').textContent = f.name;
  userAudioBuffer = null;
  userAudioDecoding = true;
  setStatus('音源を読み込んでいます…');
  f.arrayBuffer().then(function (ab) {
    var dctx = new (window.AudioContext || window.webkitAudioContext)();
    return dctx.decodeAudioData(ab).then(function (buf) {
      userAudioBuffer = buf;
      try { dctx.close(); } catch (e) {}
    }, function (err) {
      try { dctx.close(); } catch (e) {}
      throw err;
    });
  }).then(function () {
    userAudioDecoding = false;
    setStatus('音源の準備ができました。');
  }).catch(function () {
    userAudioDecoding = false;
    setStatus('音源を読み込めませんでした。別のファイルをお試しください。');
  });
});

/* ===== 写真の読み込み ===== */
function loadImage(src) {
  return new Promise(function (resolve, reject) {
    var i = new Image();
    i.onload = function () { resolve(i); };
    i.onerror = reject;
    i.src = src;
  });
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function refreshStage() {
  activeFit = selected('fit') || 'cover';
  var pattern = selected('pattern') || 'cut';
  // コラージュのプレビューは置き終わった状態、トランプは表が出た状態を見せる
  var previewT = 0;
  if (pattern === 'collage') previewT = TOTAL - 0.001;
  else if (pattern === 'trump') previewT = 4.0;
  drawFrame(previewT, pattern);
}

function bindFile(inputId, thumbId, isBefore) {
  document.getElementById(inputId).addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    loadImage(url).then(function (img) {
      if (isBefore) imgBefore = img; else imgAfter = img;
      document.getElementById(thumbId).src = url;
      refreshStage();
    }).catch(function () { setStatus('写真を読み込めませんでした。'); });
  });
}
bindFile('fileBefore', 'thumbBefore', true);
bindFile('fileAfter', 'thumbAfter', false);

document.getElementById('sampleBtn').addEventListener('click', function () {
  Promise.all([loadImage('samples/before.png'), loadImage('samples/after.jpg')])
    .then(function (imgs) {
      imgBefore = imgs[0];
      imgAfter = imgs[1];
      document.getElementById('thumbBefore').src = 'samples/before.png';
      document.getElementById('thumbAfter').src = 'samples/after.jpg';
      refreshStage();
      setStatus('サンプルの写真を入れました。');
    })
    .catch(function () { setStatus('サンプルを読み込めませんでした。'); });
});

document.getElementById('patternChoices').addEventListener('change', refreshStage);
document.getElementById('fitChoices').addEventListener('change', refreshStage);

/* ===== サロン名・ロゴ ===== */
document.getElementById('salonName').addEventListener('input', function (ev) {
  salonName = ev.target.value.trim();
  refreshStage();
});
document.getElementById('fileLogo').addEventListener('change', function (ev) {
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var url = URL.createObjectURL(f);
  loadImage(url).then(function (img) {
    imgLogo = img;
    var th = document.getElementById('logoThumb');
    th.src = url;
    th.style.display = 'block';
    refreshStage();
  }).catch(function () { setStatus('ロゴを読み込めませんでした。'); });
});

/* ===== 動画生成 ===== */
function pickMime() {
  var cands = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm',
    'video/mp4'
  ];
  for (var i = 0; i < cands.length; i++) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(cands[i])) return cands[i];
  }
  return '';
}

var making = false;
document.getElementById('makeBtn').addEventListener('click', function () {
  if (making) return;
  if (!imgBefore || !imgAfter) {
    setStatus('写真を2枚選んでください（サンプルでもOKです）。');
    return;
  }
  making = true;
  var btn = document.getElementById('makeBtn');
  btn.disabled = true;
  var pattern = selected('pattern') || 'cut';
  var music = selected('music') || 'none';
  activeFit = selected('fit') || 'cover';

  if (music === 'file' && !userAudioBuffer) {
    setStatus(userAudioDecoding
      ? '音源を読み込んでいます。少し待ってから、もう一度押してください。'
      : '音源ファイルを選んでください。');
    btn.disabled = false;
    making = false;
    return;
  }
  if (SUNO_TRACKS[music] && !sunoBuffers[music]) {
    loadSuno(music);
    setStatus('楽曲を読み込んでいます。少し待ってから、もう一度押してください。');
    btn.disabled = false;
    making = false;
    return;
  }

  var ac = null;
  var stream = cv.captureStream(30);
  if (music !== 'none') {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      var comp = ac.createDynamicsCompressor();
      var mediaDest = ac.createMediaStreamDestination();
      comp.connect(mediaDest);
      comp.connect(ac.destination); // 生成中にも聞こえるように
      if (music === 'file') {
        scheduleUserAudio(ac, comp, userAudioBuffer, ac.currentTime + 0.1, TOTAL);
      } else if (SUNO_TRACKS[music]) {
        scheduleUserAudio(ac, comp, sunoBuffers[music], ac.currentTime + 0.1, TOTAL, SUNO_TRACKS[music].offset);
      } else {
        scheduleTrack(ac, comp, music, ac.currentTime + 0.1, TOTAL);
      }
      mediaDest.stream.getAudioTracks().forEach(function (tr) { stream.addTrack(tr); });
    } catch (e) {
      ac = null; // 音声が作れなくても動画は続行
    }
  }

  var mime = pickMime();
  var rec;
  try {
    rec = mime
      ? new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 })
      : new MediaRecorder(stream, { videoBitsPerSecond: 8000000 });
  } catch (e) {
    setStatus('このブラウザでは動画を作れませんでした。Chromeでお試しください。');
    btn.disabled = false;
    making = false;
    if (ac) ac.close();
    return;
  }
  var chunks = [];
  rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
  var stopped = new Promise(function (res) { rec.onstop = res; });

  rec.start(200);
  var t0 = performance.now();
  function frame() {
    var el = (performance.now() - t0) / 1000;
    if (el >= TOTAL) {
      drawFrame(TOTAL - 0.001, pattern);
      rec.stop();
      return;
    }
    drawFrame(el, pattern);
    setStatus('動画をつくっています… ' + Math.min(100, Math.round(el / TOTAL * 100)) + '%');
    requestAnimationFrame(frame);
  }
  frame();

  stopped.then(function () {
    if (ac) { try { ac.close(); } catch (e) {} }
    var type = rec.mimeType || 'video/webm';
    var blob = new Blob(chunks, { type: type });
    var url = URL.createObjectURL(blob);
    var pv = document.getElementById('preview');
    pv.src = url;
    pv.style.display = 'block';
    var dl = document.getElementById('dl');
    dl.href = url;
    dl.download = type.indexOf('mp4') >= 0 ? 'before-after.mp4' : 'before-after.webm';
    dl.style.display = 'block';
    setStatus('できました。下で確認して、ダウンロードしてください。');
    btn.disabled = false;
    making = false;
  });
});

refreshStage();
